spring.application.name=advice-service

server.port=8082

#kafka-properties
#spring.kafka.consumer.properties.spring.json.trusted.packages="*"
#spring.kafka.consumer.properties.spring.json.trusted.packages=com.microservice.commandservice.event
#spring.kafka.consumer.properties.spring.json.value.default.type=com.microservice.commandservice.event.OrderCreatedEvent
#spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
#spring.kafka.consumer.value-deserializer=org.springframework.kafka.support.serializer.JsonDeserializer
#spring.kafka.consumer.properties.spring.json.type.mapping=event:com.microservice.adviceservice.event.OrderCreatedEvent

spring.kafka.bootstrap-servers=localhost:9092
spring.kafka.template.default-topic=command-topic
spring.kafka.consumer.key-deserializer=org.springframework.kafka.support.serializer.ErrorHandlingDeserializer
spring.kafka.consumer.value-deserializer=org.springframework.kafka.support.serializer.ErrorHandlingDeserializer
spring.kafka.consumer.group-id=advice-group
spring.kafka.consumer.auto-offset-reset=earliest
spring.kafka.listener.missing-topics-fatal=false
spring.kafka.consumer.properties.spring.json.trusted.packages=com.microservice.events
spring.kafka.consumer.properties.spring.json.value.default.type=com.microservice.events.OrderCreatedEvent

spring.kafka.consumer.properties.spring.deserializer.key.delegate.class=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.properties.spring.deserializer.value.delegate.class=org.springframework.kafka.support.serializer.JsonDeserializer